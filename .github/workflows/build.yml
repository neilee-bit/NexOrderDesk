# NEX ORDER DESK - test build (no release is made)
#
# Runs on every push to a branch (not on version tags - those use release.yml) and can be started by hand.
# On a clean Windows PC in GitHub's cloud it:
#   1. builds the app, both MSI installers, both one-click setups and update.json (same script as a release)
#   2. installs with the offline setup exactly like a user would (silently), checks version, folder and shortcuts
#   3. starts the installed app and checks that its window opens without errors
#   4. installs again with the MSI (upgrade path) and checks there is still only one entry in "Apps"
#   5. tries the online setup (shows whether the newest GitHub release can be downloaded and verified)
#   6. uninstalls and checks the user's data folder was left alone
# The built files can be downloaded from the run page (Artifacts).

name: Test build

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build everything
        shell: pwsh
        run: |
          $ok = $true
          try { ./tools/build-release.ps1 -Repository '${{ github.repository }}' *>&1 | Tee-Object -FilePath build.log }
          catch { $ok = $false; Add-Content build.log "SCRIPT STOPPED: $_" }
          if (-not $ok -or -not (Test-Path release/update.json)) {
            $lines = Select-String -Path build.log -Pattern ': error |error MSB|error WIX|SCRIPT STOPPED|Exception' |
                     Select-Object -Last 25 | ForEach-Object { $_.Line.Trim() -replace '%', '%25' }
            Write-Host ("::error title=Build failed::" + ($lines -join '%0A'))
            exit 1
          }
          $sizes = (Get-ChildItem release | ForEach-Object { "{0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB) }) -join '%0A'
          Write-Host "::notice title=Built files::$sizes"

      - name: Keep the built files
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: NexOrderDesk-test-build
          path: |
            release/*
            build.log
          if-no-files-found: ignore

      - name: Install with the offline setup (like a user)
        shell: pwsh
        run: |
          $userData = Join-Path $env:LOCALAPPDATA 'NexOrderDesk'
          New-Item -ItemType Directory -Force -Path $userData | Out-Null
          Set-Content (Join-Path $userData 'keep-me.txt') 'user data must survive install, update and uninstall'
          $p = Start-Process release/NexOrderDesk_Setup_Offline.exe -ArgumentList '/auto', '/nolaunch' -Wait -PassThru
          $errFile = Join-Path $env:TEMP 'NexOrderDesk_Setup\setup-error.txt'
          if ($p.ExitCode -ne 0) {
            $msg = if (Test-Path $errFile) { Get-Content $errFile -Raw } else { 'no message' }
            Write-Host "::error title=Offline setup failed (exit $($p.ExitCode))::$msg"
            exit 1
          }
          $exe = Join-Path $env:ProgramFiles 'NEX ORDER DESK\NexOrderDesk.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::NexOrderDesk.exe not installed"; exit 1 }
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          $folder = (Get-ItemProperty 'HKLM:\Software\Promotees\NexOrderDesk' -ErrorAction SilentlyContinue).InstallFolder
          $lnk = Test-Path (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'NEX ORDER DESK.lnk')
          $lnk2 = Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'NEX ORDER DESK.lnk')
          Write-Host "::notice title=Offline setup OK::installed $v to $folder  (desktop shortcut: $($lnk -or $lnk2))"

      - name: Start the installed app
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles 'NEX ORDER DESK\NexOrderDesk.exe'
          $log = Join-Path $env:LOCALAPPDATA 'NexOrderDesk\error_log.txt'
          if (Test-Path $log) { Remove-Item $log }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          $title = if (-not $p.HasExited) { $p.MainWindowTitle } else { '' }
          $problem = ''
          if ($p.HasExited) { $problem = "the app closed by itself (exit code $($p.ExitCode))" }
          elseif (Test-Path $log) { $problem = 'the app reported an error: ' + ((Get-Content $log -Raw) -replace "`r?`n", '%0A') }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($problem) { Write-Host "::error title=App start failed::$problem"; exit 1 }
          Write-Host "::notice title=App starts OK::window title '$title'"

      - name: Self-test of the order sheet (coordinator, Print/PDF, sizes, customers)
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles 'NEX ORDER DESK\NexOrderDesk.exe'
          $out = Join-Path $env:TEMP 'selftest.txt'
          $p = Start-Process $exe -ArgumentList '--selftest', "`"$out`"" -PassThru
          $finished = $p.WaitForExit(150000)
          if (-not $finished) {
            $diag = @()
            $p.Refresh()
            $diag += "Window title: '$($p.MainWindowTitle)'"
            try {
            Add-Type -AssemblyName UIAutomationClient
            $root = [System.Windows.Automation.AutomationElement]::RootElement
            $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
            $wins = $root.FindAll([System.Windows.Automation.TreeScope]::Children, $cond)
            foreach ($w in $wins) {
              $diag += "WINDOW: $($w.Current.Name)"
              $texts = $w.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              foreach ($t in $texts) { if ($t.Current.Name) { $diag += "   $($t.Current.ControlType.ProgrammaticName): $($t.Current.Name -replace "`r?`n", ' / ')" } }
            }
            } catch { $diag += "window scan failed: $_" }
            $log = Join-Path $env:LOCALAPPDATA 'NexOrderDesk\error_log.txt'
            if (Test-Path $log) { $diag += '--- error_log.txt'; $diag += (Get-Content $log -Tail 30) }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-6) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              Select-Object -First 3 | ForEach-Object { $diag += "--- event $($_.ProviderName)"; $diag += ($_.Message -split "`n" | Select-Object -First 25) }
            Stop-Process -Id $p.Id -Force
          }
          $lines = if (Test-Path $out) { Get-Content $out | Where-Object { $_ -notmatch '^\s+\. ' } | Select-Object -Last 60 } else { @('no result file') }
          if (-not $finished) {
            $tail = (Get-Content $out -ErrorAction SilentlyContinue | Select-Object -Last 8) -join '%0A'
            Write-Host ("::error title=Self-test did not finish::" + (($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A') + '%0A--- last lines:%0A' + $tail + '%0A' + (($diag | ForEach-Object { "$_" -replace '%', '%25' -replace "`r", '' }) -join '%0A'))
            exit 1
          }
          $lines | ForEach-Object { Write-Host $_ }
          $all = Get-Content $out
          $fails = @($all | Where-Object { $_ -like 'FAIL*' })
          $head = @($all | Select-Object -First 1)
          if ($fails.Count -gt 0) { $lines = $head + $fails }
          $body = ($lines | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
          if ($p.ExitCode -ne 0) { Write-Host "::error title=Self-test failed (exit $($p.ExitCode))::$body"; exit 1 }
          Write-Host "::notice title=Self-test passed::$body"

      - name: Layout picture TShirtOrder
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:TEMP 'NexOrderDesk_shots\TShirtOrder.jpg'
          if (Test-Path $f) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($f))
            $n = [Math]::Ceiling($b64.Length / 4000)
            if ($n -le 10) { for ($i = 0; $i -lt $n; $i++) { Write-Host "::notice title=shot TShirtOrder $($i+1)/$n::$($b64.Substring($i * 4000, [Math]::Min(4000, $b64.Length - $i * 4000)))" } }
            else { Write-Host "picture too big ($($b64.Length))" }
          }

      - name: Layout picture JacketOrder
        if: always()
        shell: pwsh
        run: |
