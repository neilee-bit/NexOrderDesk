      - name: Install again with the MSI (upgrade path)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem release -Filter '*_Setup.msi' | Select-Object -First 1).FullName
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$env:TEMP\msi-upgrade.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            $tail = (Get-Content "$env:TEMP\msi-upgrade.log" -Tail 30) -join '%0A'
            Write-Host "::error title=MSI reinstall failed ($($p.ExitCode))::$tail"; exit 1
          }
          $entries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                       Where-Object { $_.DisplayName -eq 'NEX ORDER DESK' })
          if ($entries.Count -ne 1) { Write-Host "::error::Expected one 'NEX ORDER DESK' entry in Apps, found $($entries.Count)"; exit 1 }
          Write-Host "::notice title=Upgrade path OK::one entry in Apps, version $($entries[0].DisplayVersion)"

      - name: Try the online setup
        shell: pwsh
        run: |
          $errFile = Join-Path $env:TEMP 'NexOrderDesk_Setup\setup-error.txt'
          if (Test-Path $errFile) { Remove-Item $errFile }
          $p = Start-Process release/NexOrderDesk_Setup.exe -ArgumentList '/auto', '/nolaunch' -Wait -PassThru
          $msg = if (Test-Path $errFile) { Get-Content $errFile -Raw } else { 'installed the newest published release' }
          if ($p.ExitCode -gt 1) { Write-Host "::error title=Online setup crashed ($($p.ExitCode))::$msg"; exit 1 }
          Write-Host "::notice title=Online setup (exit $($p.ExitCode))::$msg"

      - name: Uninstall and check user data is kept
        shell: pwsh
        run: |
          $e = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
               Where-Object { $_.DisplayName -eq 'NEX ORDER DESK' } | Select-Object -First 1
          $code = $e.PSChildName
          $p = Start-Process msiexec.exe -ArgumentList '/x', $code, '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Write-Host "::error::Uninstall failed ($($p.ExitCode))"; exit 1 }
          if (Test-Path (Join-Path $env:ProgramFiles 'NEX ORDER DESK\NexOrderDesk.exe')) { Write-Host "::error::Program file left behind"; exit 1 }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'NexOrderDesk\keep-me.txt'))) { Write-Host "::error::User data was deleted"; exit 1 }
          Write-Host "::notice title=Uninstall OK::program removed, user data kept"
